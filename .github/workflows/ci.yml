name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Test core
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: HangingCharms-app
          path: dist/*.zip
